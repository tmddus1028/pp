<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ko" lang="ko"><head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>OPD 국제특허심사공유시스템 - 자동검색 방지</title>
<script type="text/javascript" src="/script/jquery-1.9.1.min.js"></script>
<link rel="stylesheet" href="/css/recaptcha_popup2017.css">
<script type="text/javaScript" language="javascript">

function callback() {
	var fn = window.opener[$('#cb_fn').val()];
	var paramArr = [];
	
	for(var i=0;i<parseInt($('#cb_p_cnt').val());i++) {
		paramArr[i] = $('#cb_p' + (i+1)).val(); 
	}
	fn.apply(null, paramArr);
}

function check() {
	$.ajax({
		url: '/captcha/check.do',
		type: 'POST',
		data:{
			inputTxt : $('#inputTxt').val()
		},
		beforeSend:function(x) {},
		cache:false,
		success:function(result) {
			if(result.result == 'success') {
				callback();
				window.close();
				
			} else {
				alert('틀렸습니다');
				$('#captchaImg').attr('src', $('#captchaImg').attr('src'));
				
			}
		},
		error:function(xhr, status, error) {
		}
	});
}


</script>
</head>
<body class="popup" style="zoom: 1;">
	<input type="hidden" id="cb_fn" value="viewDocContent">
	<input type="hidden" id="cb_p_cnt" value="7">
	<input type="hidden" id="cb_p1" value="KR.20190000844.A">
	<input type="hidden" id="cb_p2" value="Request_for_the_Submission_of_an_Opinion_952019025682492_KR">
	<input type="hidden" id="cb_p3" value="application/pdf">
	<input type="hidden" id="cb_p4" value="의견제출통지서">
	<input type="hidden" id="cb_p5" value="2019.04.09">
	<input type="hidden" id="cb_p6" value="0">
	<input type="hidden" id="cb_p7" value="docContentArea">
	
	<div id="wrap">
		<div style="text-align: center; width: 100%; height: 100%;">
			<ul style="text-align: center;">
				<li style="padding: 5px;"><iframe id="captchaImg" src="/captcha/captchaImg.do" frameborder="1" width="220" height="120"></iframe></li>
				<li style="padding: 5px;">
					<input type="text" id="inputTxt" name="inputTxt" onkeydown="if(event.keyCode==13) { check(); }" style="width: 190px;">
				</li>
				<li style="padding: 5px;"><p></p></li>
					<input type="button" value="확인" onclick="javascript:check();">
				
			</ul>
		</div>
	</div>


</body></html>
