[project]
name = "patent-review"
version = "0.1.0"
description = "Evidence-linked patent and Office Action analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pypdf>=6,<7",
  "networkx>=3.3,<4",
  "openai>=2,<3",
  "python-multipart>=0.0.20,<1",
  "streamlit>=1.50,<2",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "pymupdf>=1.26,<2",
  "pytesseract>=0.3.13,<0.4",
  "pillow>=11,<13",
  "pypdfium2>=4.30,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "reportlab>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["ocr_integration: real local Tesseract OCR (skipped only if Tesseract is absent)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
