<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="review.css"></head>
<body>
<main id="workspace" aria-label="PDF 검토 작업 공간">
  <section class="viewer" aria-label="PDF Viewer" data-terminology-attrs="aria-label">
    <div class="toolbar">
      <span class="file-icon" aria-hidden="true">▤</span><select id="document" aria-label="검토 문서"></select>
      <div class="page-controls"><button id="prev" aria-label="이전 페이지">‹</button><input id="page-number" type="number" min="1" aria-label="현재 페이지"><span id="page-total"></span><button id="next" aria-label="다음 페이지">›</button></div>
      <a id="download" class="icon-button" title="원본 PDF 다운로드" aria-label="원본 PDF 다운로드">↓</a>
    </div>
    <div class="tools-secondary">
      <button id="zoom-out" aria-label="축소">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="확대">+</button>
      <button id="fit-width">너비 맞춤</button><button id="fit-page">페이지 맞춤</button>
      <div class="search"><input id="search" placeholder="문서 내 검색" aria-label="PDF 검색"><button id="search-next" aria-label="다음 검색 결과">⌕</button></div>
    </div>
    <div id="page-status" class="page-status" aria-live="polite"></div>
    <div id="pdf-scroll" class="pdf-scroll" tabindex="0" aria-label="PDF 페이지 스크롤">
      <div id="paper" class="paper"><img id="page-image" alt="원본 PDF 페이지"><div id="overlays"></div><pre id="text-page" class="readable-text"></pre></div>
      <div id="loading" class="loading" role="status" hidden>페이지를 불러오고 있습니다…</div>
    </div>
    <footer class="legend">
      <div class="relationship-summary"><div id="relationship-mini" aria-label="현재 선택 관계 요약"></div><button id="open-map">전체 관계 지도 보기</button></div>
      <div class="legend-colors"><span><i class="dot red"></i>직접 지적</span><span><i class="dot yellow"></i>종속 영향</span><span><i class="dot green"></i>인용 문헌</span><span><i class="dot teal"></i>관련 설명/근거</span></div>
      <div id="legend-filters"><button data-filter="direct_rejection">직접 지적만</button><button data-filter="dependency">종속 영향만</button><button data-filter="citation" data-terminology>citation만</button><button data-filter="all">전체 보기</button></div>
    </footer>
  </section>
  <aside class="review-panel" aria-label="Review Panel" data-terminology-attrs="aria-label">
    <header class="review-header"><div><span class="eyebrow" data-terminology>DOCUMENT REVIEW</span><h2>검토 요약</h2></div><span id="provider" class="provider"></span></header>
    <div id="summary" class="summary"></div>
    <div class="scope-row"><label for="scope">검토 범위</label><select id="scope" aria-label="거절 사유 필터" data-terminology-attrs="aria-label"></select></div>
    <div id="rejection-links" class="rejection-links"></div>
    <div class="points-title"><h3>검토 포인트</h3><span id="point-count"></span></div>
    <div id="point-filters" class="point-filters" role="group" aria-label="검토 포인트 필터"><button data-filter="all">전체</button><button data-filter="direct_rejection">직접 지적</button><button data-filter="dependency">종속 영향</button><button data-filter="citation">인용 문헌</button></div>
    <div id="review-list" class="review-list" aria-label="검토 포인트 목록"></div>
    <footer class="panel-footer">설명과 원문 근거를 함께 확인하세요.</footer>
  </aside>
</main>
<script src="annotation_geometry.js"></script>
<script src="review.js"></script>
</body></html>
